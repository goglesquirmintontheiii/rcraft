name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev \
            mesa-vulkan-drivers libvulkan1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Headless screenshot smoke test (lavapipe)
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          cargo run -q -p rustcraft -- --game-dir "$RUNNER_TEMP/rc" --screenshot "$RUNNER_TEMP/smoke.png" --size 320x180
          test -s "$RUNNER_TEMP/smoke.png"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: smoke-screenshot
          path: ${{ runner.temp }}/smoke.png
